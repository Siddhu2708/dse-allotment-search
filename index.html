<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DSE 2026 CAP Allotment Search</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fa;
        color: #1f2937;
    }

    /* Header */
    header {
        background: linear-gradient(135deg, #075e54, #0f766e);
        color: white;
        padding: 30px 20px;
        text-align: center;
    }

    header h1 {
        font-size: 28px;
        margin-bottom: 8px;
    }

    header p {
        font-size: 14px;
        opacity: 0.9;
    }

    /* Main container */
    .container {
        max-width: 1000px;
        margin: 30px auto;
        padding: 0 20px;
    }

    /* Search box */
    .search-box {
        background: white;
        padding: 22px;
        border-radius: 14px;
        box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        margin-bottom: 20px;
    }

    .search-box label {
        display: block;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .search-wrapper {
        display: flex;
        gap: 10px;
    }

    #searchInput {
        flex: 1;
        padding: 14px 16px;
        border: 1px solid #d1d5db;
        border-radius: 9px;
        font-size: 16px;
        outline: none;
    }

    #searchInput:focus {
        border-color: #0f766e;
        box-shadow: 0 0 0 3px rgba(15,118,110,0.1);
    }

    #clearBtn {
        padding: 0 20px;
        border: none;
        border-radius: 9px;
        background: #374151;
        color: white;
        cursor: pointer;
        font-size: 14px;
    }

    #clearBtn:hover {
        background: #1f2937;
    }

    .hint {
        margin-top: 10px;
        font-size: 13px;
        color: #6b7280;
    }

    /* Status */
    #status {
        margin: 15px 0;
        font-size: 14px;
        color: #4b5563;
    }

    .loading {
        color: #0f766e;
        font-weight: bold;
    }

    .error {
        background: #fee2e2;
        border: 1px solid #fecaca;
        color: #991b1b;
        padding: 15px;
        border-radius: 10px;
        line-height: 1.6;
    }

    /* Results */
    .result-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 15px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .college-name {
        font-size: 18px;
        font-weight: bold;
        color: #075e54;
        margin-bottom: 5px;
    }

    .college-code {
        color: #6b7280;
        font-size: 13px;
        margin-bottom: 10px;
    }

    .branch-name {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 15px;
        color: #111827;
    }

    .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 15px;
    }

    .tag {
        padding: 5px 10px;
        border-radius: 20px;
        background: #ecfdf5;
        color: #065f46;
        border: 1px solid #a7f3d0;
        font-size: 12px;
        font-weight: 600;
    }

    .details {
        width: 100%;
        border-collapse: collapse;
    }

    .details td {
        padding: 8px 5px;
        border-bottom: 1px solid #f0f0f0;
        font-size: 14px;
    }

    .details td:first-child,
    .details td:nth-child(3) {
        color: #6b7280;
        width: 18%;
    }

    .details td:nth-child(2),
    .details td:nth-child(4) {
        font-weight: 600;
        width: 32%;
    }

    /* Empty result */
    .empty {
        background: white;
        padding: 45px 20px;
        text-align: center;
        border-radius: 14px;
        color: #6b7280;
        border: 1px solid #e5e7eb;
    }

    /* Footer */
    footer {
        text-align: center;
        padding: 30px 20px;
        color: #6b7280;
        font-size: 13px;
    }

    /* Mobile */
    @media (max-width: 650px) {

        header h1 {
            font-size: 22px;
        }

        .search-wrapper {
            flex-direction: column;
        }

        #clearBtn {
            padding: 12px;
        }

        .details {
            font-size: 12px;
        }

        .details td {
            padding: 7px 3px;
        }

        .details td:first-child,
        .details td:nth-child(3) {
            width: 25%;
        }

        .details td:nth-child(2),
        .details td:nth-child(4) {
            width: 25%;
        }
    }
</style>
</head>

<body>

<header>
    <h1>DSE 2026 CAP Allotment Search</h1>
    <p>Search college allotment information using Application ID or Candidate Name</p>
</header>

<div class="container">

    <div class="search-box">

        <label for="searchInput">
            Search Allotment
        </label>

        <div class="search-wrapper">

            <input
                type="text"
                id="searchInput"
                placeholder="Enter Application ID or Candidate Name..."
                autocomplete="off"
            >

            <button id="clearBtn">
                Clear
            </button>

        </div>

        <div class="hint">
            You can search using Application ID or candidate name.
            Name search is case-insensitive.
        </div>

    </div>

    <div id="status">
        Loading allotment data...
    </div>

    <div id="results"></div>

</div>

<footer>
    DSE 2026 CAP Allotment Search
</footer>


<script>

    let allotmentData = [];
    let dataLoaded = false;

    /*
    =====================================================
    LOAD JSON DATA
    =====================================================
    The JSON file must be in the same GitHub repository
    and same folder as this index.html.
    */

    async function loadData() {

        const status = document.getElementById("status");

        status.innerHTML =
            '<span class="loading">Loading allotment data...</span>';

        try {

            const response = await fetch("./allotment_data.json");

            if (!response.ok) {
                throw new Error(
                    "HTTP Error: " + response.status
                );
            }

            allotmentData = await response.json();

            dataLoaded = true;

            status.innerHTML =
                "Loaded " +
                allotmentData.length.toLocaleString() +
                " allotment records. Enter a name or Application ID to search.";

        } catch (error) {

            console.error(error);

            status.innerHTML = `
                <div class="error">

                    <strong>Unable to load allotment data.</strong>
                    <br><br>

                    Please make sure that
                    <strong>allotment_data.json</strong>
                    is uploaded in the same folder as
                    <strong>index.html</strong>.

                    <br><br>

                    Error:
                    ${escapeHTML(error.message)}

                </div>
            `;
        }
    }


    /*
    =====================================================
    HTML SECURITY
    =====================================================
    */

    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value).replace(
            /[&<>"']/g,
            function(character) {

                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                };

                return entities[character];
            }
        );
    }


    /*
    =====================================================
    SEARCH FUNCTION
    =====================================================
    */

    function searchData() {

        const input =
            document.getElementById("searchInput");

        const query =
            input.value.trim();

        const results =
            document.getElementById("results");

        if (!dataLoaded) {
            return;
        }

        if (query === "") {

            results.innerHTML = "";

            document.getElementById("status").innerHTML =
                "Loaded " +
                allotmentData.length.toLocaleString() +
                " allotment records. Enter a name or Application ID to search.";

            return;
        }


        /*
        -------------------------------------------------
        Application ID Search
        -------------------------------------------------
        */

        const looksLikeApplicationID =
            /^DSE/i.test(query) ||
            /^\d{5,}$/.test(query);


        let matches = [];


        if (looksLikeApplicationID) {

            const searchID =
                query.toUpperCase().replace(/^DSE/, "");


            matches = allotmentData.filter(
                function(record) {

                    if (!record.application_id) {
                        return false;
                    }

                    const id =
                        String(record.application_id)
                        .toUpperCase()
                        .replace(/^DSE/, "");

                    return id.includes(searchID);
                }
            );

        }

        /*
        -------------------------------------------------
        Candidate Name Search
        -------------------------------------------------
        */

        else {

            const searchName =
                query.toUpperCase();

            matches = allotmentData.filter(
                function(record) {

                    if (!record.name) {
                        return false;
                    }

                    return String(record.name)
                        .toUpperCase()
                        .includes(searchName);
                }
            );
        }


        displayResults(matches, query);
    }


    /*
    =====================================================
    DISPLAY RESULTS
    =====================================================
    */

    function displayResults(matches, query) {

        const results =
            document.getElementById("results");


        if (matches.length === 0) {

            results.innerHTML = `
                <div class="empty">

                    <h3>No Results Found</h3>

                    <p style="margin-top:10px;">
                        No allotment record was found for
                        "<strong>${escapeHTML(query)}</strong>"
                    </p>

                </div>
            `;

            document.getElementById("status").textContent =
                "No matching records found.";

            return;
        }


        document.getElementById("status").textContent =
            "Found " +
            matches.length.toLocaleString() +
            " matching record(s).";


        /*
        Limit display to 200 records
        */

        const displayRecords =
            matches.slice(0, 200);


        results.innerHTML =
            displayRecords.map(
                function(record) {

                    return `

                    <div class="result-card">

                        <div class="college-name">
                            ${escapeHTML(record.college_name)}
                        </div>

                        <div class="college-code">

                            College Code:
                            ${escapeHTML(record.college_code)}

                            &nbsp; | &nbsp;

                            Branch Code:
                            ${escapeHTML(record.branch_code)}

                        </div>


                        <div class="branch-name">
                            ${escapeHTML(record.branch_name)}
                        </div>


                        <div class="tags">

                            <span class="tag">
                                ${escapeHTML(record.seat_type)}
                            </span>

                            <span class="tag">
                                ${escapeHTML(record.category)}
                            </span>

                            <span class="tag">
                                ${
                                    record.gender === "M"
                                    ? "Male"
                                    : record.gender === "F"
                                    ? "Female"
                                    : escapeHTML(record.gender)
                                }
                            </span>

                        </div>


                        <table class="details">

                            <tr>

                                <td>
                                    Application ID
                                </td>

                                <td>
                                    ${escapeHTML(record.application_id)}
                                </td>

                                <td>
                                    Candidate
                                </td>

                                <td>
                                    ${escapeHTML(record.name)}
                                </td>

                            </tr>


                            <tr>

                                <td>
                                    Merit No.
                                </td>

                                <td>
                                    ${escapeHTML(record.merit_no)}
                                </td>

                                <td>
                                    Merit Score
                                </td>

                                <td>
                                    ${escapeHTML(record.merit_score)}
                                </td>

                            </tr>

                        </table>

                    </div>

                    `;
                }
            ).join("");


        if (matches.length > 200) {

            results.innerHTML += `

                <div class="empty">

                    Showing first 200 results
                    out of
                    ${matches.length.toLocaleString()}.

                    <br>

                    Please enter a more specific
                    Application ID or name.

                </div>

            `;
        }
    }


    /*
    =====================================================
    SEARCH EVENT
    =====================================================
    */

    let searchTimer;


    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            function() {

                clearTimeout(searchTimer);

                searchTimer =
                    setTimeout(
                        searchData,
                        150
                    );
            }
        );


    /*
    =====================================================
    CLEAR BUTTON
    =====================================================
    */

    document
        .getElementById("clearBtn")
        .addEventListener(
            "click",
            function() {

                document
                    .getElementById("searchInput")
                    .value = "";

                document
                    .getElementById("results")
                    .innerHTML = "";

                document
                    .getElementById("status")
                    .textContent =
                    "Loaded " +
                    allotmentData.length.toLocaleString() +
                    " allotment records. Enter a name or Application ID to search.";

                document
                    .getElementById("searchInput")
                    .focus();
            }
        );


    /*
    =====================================================
    START APPLICATION
    =====================================================
    */

    loadData();

</script>

</body>
</html>
