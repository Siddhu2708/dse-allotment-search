<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DSE 2026 | CAP Round-II Allotment Search</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f8;
            color: #1f2937;
        }

        /* Header */
        header {
            background: #087f6b;
            color: white;
            padding: 28px 6%;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        header p {
            margin: 0;
            font-size: 16px;
            opacity: 0.95;
        }

        /* Main */
        main {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        /* Search box */
        .search-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        #searchInput {
            width: 100%;
            padding: 17px 20px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 18px;
            outline: none;
        }

        #searchInput:focus {
            border-color: #087f6b;
            box-shadow: 0 0 0 3px rgba(8,127,107,0.12);
        }

        .tip {
            margin-top: 12px;
            color: #64748b;
            font-size: 14px;
        }

        /* Status */
        #status {
            margin-top: 20px;
        }

        .error {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 20px;
            border-radius: 10px;
        }

        .loading {
            background: #e0f2fe;
            color: #0369a1;
            padding: 15px;
            border-radius: 10px;
        }

        /* Results */
        #results {
            margin-top: 25px;
        }

        .result-count {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .candidate-card {
            background: white;
            border-left: 6px solid #087f6b;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .candidate-card h2 {
            margin: 0 0 20px;
            color: #087f6b;
            font-size: 24px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .detail {
            background: #f5f8f8;
            padding: 15px;
            border-radius: 8px;
        }

        .label {
            display: block;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .value {
            display: block;
            color: #111827;
            font-size: 17px;
            font-weight: bold;
            word-break: break-word;
        }

        /* Institute section */
        .institute {
            grid-column: span 4;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
        }

        .course {
            grid-column: span 4;
            background: #f0fdfa;
            border: 1px solid #99f6e4;
        }

        /* Footer */
        footer {
            margin-top: 50px;
            background: #123c36;
            color: white;
            text-align: center;
            padding: 25px;
        }

        footer p {
            margin: 5px 0;
        }

        footer a {
            color: #a7f3d0;
            text-decoration: none;
        }

        /* Mobile */
        @media (max-width: 900px) {

            .details {
                grid-template-columns: repeat(2, 1fr);
            }

            .institute,
            .course {
                grid-column: span 2;
            }
        }

        @media (max-width: 600px) {

            header {
                padding: 22px 5%;
            }

            header h1 {
                font-size: 23px;
            }

            main {
                width: 94%;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .institute,
            .course {
                grid-column: span 1;
            }

            #searchInput {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>DSE 2026 • CAP Round-II Allotment Search</h1>
    <p>
        Search DSE CAP Round-II allotment data by Application ID or candidate name.
    </p>
</header>

<main>

    <section class="search-section">

        <input
            type="text"
            id="searchInput"
            placeholder="Enter Application ID (e.g. DSE26167579) or candidate name..."
            autocomplete="off"
        >

        <div class="tip">
            Tip: Application ID gives an exact match.
            Name search is partial and case-insensitive.
        </div>

        <div id="status"></div>

    </section>

    <section id="results"></section>

</main>

<footer>

    <p>
        DSE 2026 CAP Round-II Allotment Search
    </p>

    <p>
        Developed by
        <a
            href="https://github.com/Siddhu2708"
            target="_blank"
        >
            Siddharth Gaykhe
        </a>
    </p>

</footer>


<script>

    /* =========================================================
       CAP ROUND-II JSON FILE
       ========================================================= */

    const DATA_FILE = "./allotment_data.json";

    let allotmentData = [];


    /* =========================================================
       LOAD JSON
       ========================================================= */

    async function loadData() {

        const status = document.getElementById("status");

        status.innerHTML = `
            <div class="loading">
                Loading CAP Round-II allotment data...
            </div>
        `;

        try {

            const response = await fetch(DATA_FILE);

            if (!response.ok) {
                throw new Error(
                    "HTTP Error " + response.status
                );
            }

            const data = await response.json();

            if (!Array.isArray(data)) {
                throw new Error(
                    "JSON data must be an array."
                );
            }

            allotmentData = data;

            status.innerHTML = "";

            console.log(
                "CAP Round-II records loaded:",
                allotmentData.length
            );

        } catch (error) {

            console.error(error);

            status.innerHTML = `
                <div class="error">
                    <strong>Unable to load CAP Round-II allotment data.</strong>

                    <p>
                        Please make sure
                        <strong>allotment_data.json</strong>
                        is uploaded in the same folder as
                        <strong>index.html</strong>.
                    </p>

                    <p>
                        Error:
                        ${escapeHTML(error.message)}
                    </p>
                </div>
            `;
        }
    }


    /* =========================================================
       SEARCH
       ========================================================= */

    function searchCandidates(query) {

        query = query.trim().toLowerCase();

        if (!query) {

            document.getElementById("results").innerHTML = "";

            return;
        }

        const results = allotmentData.filter(record => {

            const applicationId =
                String(record.application_id || "")
                .toLowerCase();

            const name =
                String(record.name || "")
                .toLowerCase();

            return (
                applicationId === query ||
                name.includes(query)
            );
        });

        displayResults(results);
    }


    /* =========================================================
       DISPLAY RESULTS
       ========================================================= */

    function displayResults(results) {

        const resultsContainer =
            document.getElementById("results");

        if (results.length === 0) {

            resultsContainer.innerHTML = `
                <div class="error">
                    No CAP Round-II allotment found.
                </div>
            `;

            return;
        }

        let html = `
            <div class="result-count">
                ${results.length} result(s) found
            </div>
        `;

        results.forEach(record => {

            html += `

                <div class="candidate-card">

                    <h2>
                        ${escapeHTML(
                            record.name || "N/A"
                        )}
                    </h2>

                    <div class="details">

                        <div class="detail institute">
                            <span class="label">
                                Institute
                            </span>

                            <span class="value">
                                ${escapeHTML(
                                    record.institute || "N/A"
                                )}
                            </span>
                        </div>


                        <div class="detail course">
                            <span class="label">
                                Course
                            </span>

                            <span class="value">
                                ${escapeHTML(
                                    record.course || "N/A"
                                )}
                            </span>
                        </div>


                        <div class="detail">

                            <span class="label">
                                Application ID
                            </span>

                            <span class="value">
                                ${escapeHTML(
                                    record.application_id || "N/A"
                                )}
                            </span>

                        </div>


                        <div class="detail">

                            <span class="label">
                                Gender
                            </span>

                            <span class="value">
                                ${escapeHTML(
                                    record.gender || "N/A"
                                )}
                            </span>

                        </div>


                        <div class="detail">

                            <span class="label">
                                Category
                            </span>

                            <span class="value">
                                ${escapeHTML(
                                    record.category || "N/A"
                                )}
                            </span>

                        </div>


                        <div class="detail">

                            <span class="label">
                                Seat Type
                            </span>

                            <span class="value">
                                ${escapeHTML(
                                    record.seat_type || "N/A"
                                )}
                            </span>

                        </div>


                        <div class="detail">

                            <span class="label">
                                Merit No
                            </span>

                            <span class="value">
                                ${escapeHTML(
                                    record.merit_no ?? "N/A"
                                )}
                            </span>

                        </div>


                        <div class="detail">

                            <span class="label">
                                Merit Score
                            </span>

                            <span class="value">
                                ${escapeHTML(
                                    record.merit_score ?? "N/A"
                                )}
                            </span>

                        </div>

                    </div>

                </div>
            `;
        });

        resultsContainer.innerHTML = html;
    }


    /* =========================================================
       ESCAPE HTML
       Prevents HTML injection from JSON data.
       ========================================================= */

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =========================================================
       SEARCH EVENT
       ========================================================= */

    document
        .getElementById("searchInput")
        .addEventListener("input", function () {

            searchCandidates(this.value);

        });


    /* =========================================================
       START
       ========================================================= */

    loadData();

</script>

</body>
</html>
